packages:
  - "apps/*"
  - "packages/*"
  # the organization's policy, which turbo builds once for every service
  - "policies"
  # a module's docs site is its own workspace member, so its Next and MDX
  # dependencies stay out of the module it documents. A module cloned on its
  # own carries the same arrangement in its own pnpm-workspace.yaml.
  - "apps/*/docs"
  - "packages/*/docs"

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@fairgarden/docs@0.13.4-canary.18'
  - '@fairgarden/design@0.1.0-alpha.2'

# fg:overrides
# A distribution uses its own checkouts, whatever version they are at. The
# ranges in each module stay honest for publishing; this is what stops them
# being resolved from the registry once a submodule moves past them.
overrides:
  "@fairgarden/design": "workspace:*"
  "@fairgarden/distribution": "workspace:*"
  "@fairgarden/id": "workspace:*"
  "@fairgarden/indicators": "workspace:*"
  "@fairgarden/members": "workspace:*"
  "@fairgarden/monolith": "workspace:*"
  "@fairgarden/policy": "workspace:*"
  # The docs sites are built on the published design system, not this
  # checkout of it. fg-dist keeps these lines when it rewrites the block.
  "@fairgarden/policy-docs>@fairgarden/design": "^0.1.0-alpha.2"
  "@fairgarden/id-docs>@fairgarden/design": "^0.1.0-alpha.2"
  "@fairgarden/members-docs>@fairgarden/design": "^0.1.0-alpha.2"
  "@fairgarden/distribution-docs>@fairgarden/design": "^0.1.0-alpha.2"
  "@fairgarden/monolith-docs>@fairgarden/design": "^0.1.0-alpha.2"
  "@fairgarden/indicators-docs>@fairgarden/design": "^0.1.0-alpha.2"
# fg:overrides:end
